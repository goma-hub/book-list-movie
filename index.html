<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body { background: #f7f1e6; font-family: "Noto Sans JP", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="opening" class="clip" data-track-kind="graphics" data-track-index="0" data-composition-id="opening" data-composition-src="compositions/opening.html" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
      <div id="home" class="clip" data-track-kind="graphics" data-track-index="0" data-composition-id="home" data-composition-src="compositions/home.html" data-start="5" data-duration="10" data-width="1920" data-height="1080"></div>
      <div id="features" class="clip" data-track-kind="graphics" data-track-index="0" data-composition-id="features" data-composition-src="compositions/features.html" data-start="15" data-duration="20" data-width="1920" data-height="1080"></div>
      <div id="ending" class="clip" data-track-kind="graphics" data-track-index="0" data-composition-id="ending" data-composition-src="compositions/ending.html" data-start="35" data-duration="10" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
